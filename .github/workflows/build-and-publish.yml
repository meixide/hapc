name: Build and Publish Wheels

permissions:
  contents: write

on:
  push:
    branches:
      - main  # Trigger on pushes to main (for testing builds)
    tags:
      - 'v*'  # Trigger on version tags like v0.1.2
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Free disk space (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev build-essential
          pip install --upgrade pip setuptools wheel pybind11 numpy scipy scikit-learn
      
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake eigen
          pip install --upgrade pip setuptools wheel pybind11 numpy scipy scikit-learn
      
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Install cmake via choco
          choco install cmake -y
          # Install pip packages (Eigen3 will be downloaded via FetchContent in CMake)
          pip install --upgrade pip setuptools wheel pybind11 numpy scipy scikit-learn
      
      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Build wheel
        if: runner.os != 'Linux'
        run: python -m pip wheel . --no-deps -w dist/ -v

      - name: Build manylinux wheels
        if: runner.os == 'Linux'
        uses: docker://quay.io/pypa/manylinux2014_x86_64
        with:
          entrypoint: /bin/bash
          args: >
            -c "
            set -e -x &&
            mkdir -p /github/workspace/dist &&
            yum install -y eigen3-devel &&
            export CMAKE_PREFIX_PATH=/usr/include/eigen3 &&
            for PYBIN in /opt/python/*/bin; do
                if [[ \${PYBIN} == *cp38* || \${PYBIN} == *cp39* || \${PYBIN} == *cp310* || \${PYBIN} == *cp311* || \${PYBIN} == *cp312* ]]; then
                  \${PYBIN}/pip wheel /github/workspace --no-deps -w /github/workspace/dist/ &&
                  \${PYBIN}/pip install auditwheel &&
                  auditwheel repair /github/workspace/dist/hapc-*-linux_x86_64.whl -w /github/workspace/dist/ &&
                  rm /github/workspace/dist/hapc-*-linux_x86_64.whl
                fi
            done
            "
      
      - name: List built wheels
        shell: bash
        run: ls -R dist/
      
      - name: Clean up build artifacts
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf build/
          rm -rf *.egg-info
          rm -rf CMakeCache.txt
      
      - name: Clean up build artifacts (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue }
          if (Test-Path "*.egg-info") { Remove-Item -Recurse -Force "*.egg-info" -ErrorAction SilentlyContinue }
          if (Test-Path "CMakeCache.txt") { Remove-Item -Force "CMakeCache.txt" -ErrorAction SilentlyContinue }
      
      - name: Upload wheels to artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel twine build
      
      - name: Build source distribution
        run: python -m build --sdist
      
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels-temp
      
      - name: Organize wheels
        run: |
          mkdir -p dist
          if [ -d wheels-temp ]; then
            echo "Copying wheel artifacts from wheels-temp to dist/"
            find wheels-temp -name "*.whl" -exec cp {} dist/ \;
          else
            echo "No wheels-temp directory found; proceeding with sdist only."
          fi

      - name: List files to publish
        run: |
          echo "Contents of dist/:"
          ls -R dist/ || echo "dist/ directory is empty or missing"
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* --skip-existing --verbose
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
