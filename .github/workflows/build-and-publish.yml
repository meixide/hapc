name: Build and Publish Wheels

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.2
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Free disk space (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev build-essential
          pip install --upgrade pip setuptools wheel pybind11 numpy scipy scikit-learn
      
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake eigen
          pip install --upgrade pip setuptools wheel pybind11 numpy scipy scikit-learn
      
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake visualstudio2022-workload-nativedesktop -y
          pip install --upgrade pip setuptools wheel pybind11 numpy scipy scikit-learn
      
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist/
      
      - name: List built wheels
        run: ls -lh dist/
      
      - name: Clean up build artifacts
        if: always()
        run: |
          rm -rf build/
          rm -rf *.egg-info
          rm -rf CMakeCache.txt
      
      - name: Upload wheels to artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel twine build
      
      - name: Build source distribution
        run: python -m build --sdist
      
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels-temp
      
      - name: Organize wheels
        run: |
          mkdir -p dist
          find wheels-temp -name "*.whl" -exec cp {} dist/ \;
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* --skip-existing --verbose
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
