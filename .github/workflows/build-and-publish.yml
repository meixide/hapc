name: Build and Publish Wheels

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.2
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu  -> manylinux2014 x86_64 (glibc 2.17 baseline, runs on any HPC)
        # macos-14 -> Apple Silicon runner; builds fat universal2 (x86_64+arm64)
        # windows -> AMD64
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # cibuildwheel builds + repairs (auditwheel/delocate/delvewheel) every
      # selected CPython ABI in one go. All build selection / manylinux image /
      # skip rules live in [tool.cibuildwheel] in pyproject.toml so the exact
      # same build is reproducible locally via `pipx run cibuildwheel`.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error  # never silently publish a release with missing wheels

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: List files to publish
        run: ls -R dist/

      # Guard against the exact failure mode that shipped 2.3.0 without Linux
      # wheels: refuse to publish unless a manylinux wheel is present.
      - name: Verify Linux wheels are present
        run: |
          if ! ls dist/*manylinux*_x86_64.whl >/dev/null 2>&1; then
            echo "::error::No manylinux wheels found in dist/ — aborting publish."
            exit 1
          fi

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: pipx run twine upload dist/* --skip-existing --verbose

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
