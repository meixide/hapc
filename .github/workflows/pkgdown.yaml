# Build the R reference site with pkgdown and publish it via GitHub Pages using
# the **artifact** deployment path — this does NOT create a gh-pages branch and
# adds no bot commits to git history. Manual / release triggered only.
#
# Requires repo Settings -> Pages -> Source = "GitHub Actions".
on:
  workflow_dispatch:
  release:
    types: [published]

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-r

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
