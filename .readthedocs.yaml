# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The Python API docs are built from docstrings with Sphinx. The compiled
# pybind11 extension (hapc.hapc_core) is mocked in docs/conf.py, so no C++
# toolchain is required — only the pip dependencies in docs/requirements.txt.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
